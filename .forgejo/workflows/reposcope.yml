name: Update Language Stats

on:
    schedule:
        - cron: "0 0 * * 1"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout target repo
              uses: https://code.forgejo.org/actions/checkout@v7

            - name: Download self-reposcope binary from GitHub Release
              shell: bash
              run: |
                  curl --fail --location --retry 3 https://github.com/4okimi7uki/self-reposcope/releases/latest/download/self-reposcope -o self-reposcope
                  chmod +x ./self-reposcope

            - name: Run self-reposcope CLI
              shell: bash
              run: |
                  mkdir -p output
                  ./self-reposcope --token ${{ secrets.REPOSCOPE_TOKEN }} --forgejo-url ${{ github.server_url }} --forgejo-token ${{ secrets.FORGEJO_TOKEN }} --excluded-languages ${{ secrets.EXCLUDED_LANGUAGES }}

            - name: Commit and Push updated SVGs
              shell: bash
              run: |
                  git config --global user.name 'forgejo-actions[bot]'
                  git config --global user.email 'forgejo-actions[bot]@users.noreply.localhost'
                  git add output/*.svg
                  if git diff --cached --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "update: language stats svg"
                    git push origin HEAD:main
                  fi
