pt = "Automatizei a validação e a publicação de pacotes compartilhados de autenticação, telemetria e manifests de releases com workflows do GitHub Actions acionados por tags."
pt-BR = "Automatizei a validação e a publicação de pacotes compartilhados de autenticação, telemetria e manifests de releases com workflows do GitHub Actions acionados por tags."

