[content.project.07.brief]
en = "A playlist migration application for Spotify and YouTube. It compares candidate recordings, displays match scores, and allows users to review alternative results."
pt = "Aplicativo de migração de playlists entre Spotify e YouTube. Compara as gravações encontradas, exibe as pontuações de correspondência e permite revisar resultados alternativos."
pt-BR = "Aplicativo de migração de playlists entre Spotify e YouTube. Compara as gravações encontradas, exibe as pontuações de correspondência e permite revisar resultados alternativos."

[content.project.07.detail]
en = "Playlist Converter matches recordings across Spotify and YouTube using duration, title, artist, album, and channel information. Version terms such as live, cover, acoustic, and remix affect the score: different versions receive a penalty, while corresponding versions receive additional points.\n\nThe interface presents the best candidate alongside alternatives and score breakdowns, allowing users to review and correct matches. Duration differences above thirty seconds reject a candidate. Tutorial and disclaimer terms receive penalties, while YouTube topic channels provide additional matching signals.\n\nThe Expo/React Native client receives resolved tracks through a streamed response. A Node/Express backend written in TypeScript manages authentication and requests to both platforms, and cancels processing when the client disconnects. Playlist migration works in both directions."
pt = "O Playlist Converter identifica gravações correspondentes no Spotify e no YouTube com base na duração, no título, no artista, no álbum e nas informações do canal. Termos de versão, como live, cover, acoustic e remix, afetam a pontuação: versões diferentes recebem uma penalidade, enquanto versões correspondentes recebem pontos adicionais.\n\nA interface apresenta o melhor candidato junto das alternativas e do detalhamento das pontuações, permitindo revisar e corrigir as correspondências. Diferenças de duração acima de trinta segundos descartam o candidato. Termos de tutorial e disclaimer recebem penalidades, enquanto canais de tópico do YouTube fornecem sinais adicionais para a comparação.\n\nO cliente Expo/React Native recebe as faixas identificadas em uma resposta contínua. Um backend Node/Express em TypeScript gerencia a autenticação e as requisições às duas plataformas e cancela o processamento quando o cliente desconecta. A migração de playlists funciona nos dois sentidos."
pt-BR = "O Playlist Converter identifica gravações correspondentes no Spotify e no YouTube com base na duração, no título, no artista, no álbum e nas informações do canal. Termos de versão, como live, cover, acoustic e remix, afetam a pontuação: versões diferentes recebem uma penalidade, enquanto versões correspondentes recebem pontos adicionais.\n\nA interface apresenta o melhor candidato junto das alternativas e do detalhamento das pontuações, permitindo revisar e corrigir as correspondências. Diferenças de duração acima de trinta segundos descartam o candidato. Termos de tutorial e disclaimer recebem penalidades, enquanto canais de tópico do YouTube fornecem sinais adicionais para a comparação.\n\nO cliente Expo/React Native recebe as faixas identificadas em uma resposta contínua. Um backend Node/Express em TypeScript gerencia a autenticação e as requisições às duas plataformas e cancela o processamento quando o cliente desconecta. A migração de playlists funciona nos dois sentidos."

