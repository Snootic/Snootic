[content.personal.brief.1]
en = "I'm a software developer based in São Paulo, with experience in 3D applications, document automation, and infrastructure. At NewCAD, I develop features for a desktop CAD application used in interior design, working on scene editing, rendering performance, and the services that support the product."
pt = "Sou desenvolvedor de software em São Paulo, com experiência em aplicações 3D, automação de documentos e infraestrutura. No NewCAD, desenvolvo funcionalidades para um aplicativo CAD voltado ao design de interiores. Trabalho na edição de cenas, no desempenho da renderização e nos serviços que dão suporte ao produto."
pt-BR = "Sou desenvolvedor de software em São Paulo, com experiência em aplicações 3D, automação de documentos e infraestrutura. No NewCAD, desenvolvo funcionalidades para um aplicativo CAD voltado ao design de interiores. Trabalho na edição de cenas, no desempenho da renderização e nos serviços que dão suporte ao produto."

[content.personal.brief.2]
en = "I began programming during my Systems Analysis and Development degree at Fatec in 2023. My professional experience includes translation, education, and 3D software. Alongside that work, I develop independent projects and maintain a two-node homelab where I host applications and manage their infrastructure."
