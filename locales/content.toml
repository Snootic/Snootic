[content.project.01.brief]
en = "A tool for configuring, building, and running Minecraft servers. It combines modpack selection, server settings, downloadable builds, and Docker-based hosting."
pt = "Ferramenta para configurar, montar e executar servidores de Minecraft. Reúne seleção de modpacks, configurações do servidor, geração de arquivos para download e hospedagem com Docker."
pt-BR = "Ferramenta para configurar, montar e executar servidores de Minecraft. Reúne seleção de modpacks, configurações do servidor, geração de arquivos para download e hospedagem com Docker."

[content.project.01.detail]
en = "I developed Minecraft Server Builder to bring server configuration, build generation, and deployment into one workflow, building both the React/TypeScript interface and the Rust backend that manages Docker. It resolves compatible game versions, loaders, and content from Modrinth, obtains server jars from MCJars, and uses Minecraft Wiki metadata to describe settings. Users can import a .mrpack or select mods and datapacks individually.\n\nThe React and TypeScript interface provides controls for server properties, gamerules, memory allocation, and Java arguments. Gamerules are generated as a datapack with layouts compatible with older and newer versions of Minecraft. The configured server can be downloaded as a ZIP or submitted to the Rust backend for execution.\n\nThe backend manages Docker through bollard, using an itzg/minecraft-server container and a persistent data directory for each server. The mc-router proxy routes players by hostname, starts servers when a player connects, and stops them after an idle period. Custom MOTDs indicate when a server is stopped or loading."
pt = "Desenvolvi o Minecraft Server Builder para reunir configuração, geração de builds e implantação de servidores em um único fluxo. Criei tanto a interface React/TypeScript quanto o backend Rust que gerencia o Docker. O aplicativo resolve versões, loaders e conteúdos compatíveis no Modrinth, obtém arquivos de servidor no MCJars e usa metadados da Minecraft Wiki para descrever as configurações. É possível importar um .mrpack ou selecionar mods e datapacks individualmente.\n\nA interface em React e TypeScript permite ajustar propriedades do servidor, gamerules, alocação de memória e argumentos do Java. As gamerules são geradas como um datapack com estruturas compatíveis com versões antigas e recentes do Minecraft. O servidor configurado pode ser baixado em um ZIP ou enviado ao backend em Rust para execução.\n\nO backend gerencia o Docker com bollard e cria um container itzg/minecraft-server com um diretório persistente de dados para cada servidor. O proxy mc-router direciona os jogadores pelo hostname, inicia os servidores quando alguém se conecta e os desliga após um período de inatividade. MOTDs personalizados indicam quando o servidor está desligado ou carregando."
pt-BR = "Desenvolvi o Minecraft Server Builder para reunir configuração, geração de builds e implantação de servidores em um único fluxo. Criei tanto a interface React/TypeScript quanto o backend Rust que gerencia o Docker. O aplicativo resolve versões, loaders e conteúdos compatíveis no Modrinth, obtém arquivos de servidor no MCJars e usa metadados da Minecraft Wiki para descrever as configurações. É possível importar um .mrpack ou selecionar mods e datapacks individualmente.\n\nA interface em React e TypeScript permite ajustar propriedades do servidor, gamerules, alocação de memória e argumentos do Java. As gamerules são geradas como um datapack com estruturas compatíveis com versões antigas e recentes do Minecraft. O servidor configurado pode ser baixado em um ZIP ou enviado ao backend em Rust para execução.\n\nO backend gerencia o Docker com bollard e cria um container itzg/minecraft-server com um diretório persistente de dados para cada servidor. O proxy mc-router direciona os jogadores pelo hostname, inicia os servidores quando alguém se conecta e os desliga após um período de inatividade. MOTDs personalizados indicam quando o servidor está desligado ou carregando."

