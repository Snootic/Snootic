[content.project.02.brief]
en = "An image-processing application with desktop and self-hosted web versions. It combines upscaling, resizing, format conversion, and PDF processing on infrastructure controlled by the user."
pt = "Aplicativo de processamento de imagens com versões para desktop e web self-hosted. Reúne ampliação, redimensionamento, conversão de formatos e processamento de PDFs em infraestrutura controlada pelo usuário."
pt-BR = "Aplicativo de processamento de imagens com versões para desktop e web self-hosted. Reúne ampliação, redimensionamento, conversão de formatos e processamento de PDFs em infraestrutura controlada pelo usuário."

[content.project.02.detail]
en = "I designed and built Mutaria as an image-processing application with desktop and self-hosted web versions. The desktop build processes files locally, while the web version runs on infrastructure chosen by its operator. Server jobs continue after disconnections, progress is recovered when the client reconnects, and stored state survives restarts. Both versions share a Rust codebase and Leptos interface, with Actix Web serving the API and Tauri packaging the desktop application.\n\nProcessing jobs combine operations in sequence, including Real-ESRGAN upscaling, resizing to specified dimensions, and format conversion. The application also creates PDFs from images and renders selected PDF pages at 72–300 DPI. Batch resizing supports up to 100 images, and results are available individually or in a ZIP archive.\n\nNCNN and Vulkan support processing on Intel, AMD, and NVIDIA GPUs, with a CPU fallback. Installed models determine the available 2×, 3×, and 4× upscaling options. Server jobs continue after a tab closes or the connection drops; progress is recovered on reconnection, and stored state survives restarts. Interrupted steps are prepared for retry. Cancellation covers uploads and active processing, busy devices queue work, and specific errors distinguish encrypted PDFs, unsupported formats, and size limits."
pt = "Projetei e desenvolvi o Mutaria como um aplicativo de processamento de imagens com versões desktop e web auto-hospedada. A versão desktop processa arquivos localmente; a versão web roda na infraestrutura escolhida por quem a opera. Os jobs do servidor continuam após desconexões, o progresso é recuperado quando o cliente reconecta e o estado salvo sobrevive a reinicializações. As duas versões compartilham o código Rust e a interface Leptos, com Actix Web na API e Tauri no empacotamento desktop.\n\nAs tarefas combinam operações em sequência, como ampliação com Real-ESRGAN, redimensionamento para dimensões específicas e conversão de formatos. O aplicativo também gera PDFs a partir de imagens e renderiza páginas selecionadas de PDF entre 72 e 300 DPI. O redimensionamento em lote aceita até 100 imagens, e os resultados ficam disponíveis individualmente ou em um arquivo ZIP.\n\nO processamento usa NCNN e Vulkan em GPUs Intel, AMD e NVIDIA, com fallback para CPU. Os modelos instalados determinam as opções de ampliação de 2×, 3× e 4×. As tarefas do servidor continuam após o fechamento da aba ou a perda de conexão; o progresso é recuperado ao reconectar, e o estado salvo é mantido após reinicializações. Etapas interrompidas ficam preparadas para uma nova tentativa. O cancelamento funciona durante o upload e o processamento, dispositivos ocupados enfileiram tarefas e os erros distinguem PDFs criptografados, formatos incompatíveis e limites de tamanho."
pt-BR = "Projetei e desenvolvi o Mutaria como um aplicativo de processamento de imagens com versões desktop e web auto-hospedada. A versão desktop processa arquivos localmente; a versão web roda na infraestrutura escolhida por quem a opera. Os jobs do servidor continuam após desconexões, o progresso é recuperado quando o cliente reconecta e o estado salvo sobrevive a reinicializações. As duas versões compartilham o código Rust e a interface Leptos, com Actix Web na API e Tauri no empacotamento desktop.\n\nAs tarefas combinam operações em sequência, como ampliação com Real-ESRGAN, redimensionamento para dimensões específicas e conversão de formatos. O aplicativo também gera PDFs a partir de imagens e renderiza páginas selecionadas de PDF entre 72 e 300 DPI. O redimensionamento em lote aceita até 100 imagens, e os resultados ficam disponíveis individualmente ou em um arquivo ZIP.\n\nO processamento usa NCNN e Vulkan em GPUs Intel, AMD e NVIDIA, com fallback para CPU. Os modelos instalados determinam as opções de ampliação de 2×, 3× e 4×. As tarefas do servidor continuam após o fechamento da aba ou a perda de conexão; o progresso é recuperado ao reconectar, e o estado salvo é mantido após reinicializações. Etapas interrompidas ficam preparadas para uma nova tentativa. O cancelamento funciona durante o upload e o processamento, dispositivos ocupados enfileiram tarefas e os erros distinguem PDFs criptografados, formatos incompatíveis e limites de tamanho."

