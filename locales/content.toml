[content.project.03.brief]
en = "A two-node homelab that hosts my applications, media services, home automation, and game servers. I manage deployment, networking, and DNS automation."
pt = "Homelab com dois nós que hospeda minhas aplicações, serviços de mídia, automação residencial e servidores de jogos. Sou responsável pelos deploys, pelas redes e pela automação de DNS."
pt-BR = "Homelab com dois nós que hospeda minhas aplicações, serviços de mídia, automação residencial e servidores de jogos. Sou responsável pelos deploys, pelas redes e pela automação de DNS."

[content.project.03.detail]
en = "I operate a two-node homelab with an amd64 manager and an arm64 worker, running approximately thirty Docker Compose and Swarm stacks. I manage deployment, networking, service isolation, and automation for applications, media, email, home automation, source-code hosting, and game servers. Configuration scripts restore service settings after backup recovery.\n\nThe network design separates service traffic, data stores, and LAN-facing containers. A private overlay connects services, macvlan assigns containers their own LAN and public IPv6 addresses, and internal networks isolate databases without outbound access. Services hosted for friends use dedicated bridges and WireGuard access, without routes into the lab or LAN.\n\nDNS automation uses container labels to update Cloudflare records across accounts and zones, including IPv6 changes caused by the ISP. Traefik handles traffic and TLS with a Let's Encrypt wildcard issued through DNS-01, as well as Minecraft routing and MQTT TLS. A restricted Docker API proxy provides container discovery across the two nodes.\n\nThe media services share paths to support hardlink imports while downloads continue seeding. Configuration scripts can restore service settings after a backup recovery. Approximately 2,500 lines of Bash and Python automate networking, DNS, routing, and service configuration."
pt = "Opero um homelab de dois nós, com um manager amd64 e um worker arm64, que executa aproximadamente trinta stacks Docker Compose e Swarm. Gerencio implantação, redes, isolamento de serviços e automação para aplicativos, mídia, e-mail, automação residencial, hospedagem de código e servidores de jogos. Scripts de configuração restauram os ajustes dos serviços após a recuperação de backups.\n\nA arquitetura de rede separa o tráfego dos serviços, os bancos de dados e os containers com acesso à LAN. Um overlay privado conecta os serviços, a rede macvlan atribui endereços próprios na LAN e IPv6 públicos aos containers, e redes internas isolam os bancos sem acesso externo. Os serviços hospedados para amigos usam bridges dedicadas e acesso por WireGuard, sem rotas para as redes do lab ou para a LAN.\n\nA automação de DNS usa labels dos containers para atualizar registros no Cloudflare em diferentes contas e zonas, incluindo mudanças de IPv6 feitas pelo provedor. O Traefik gerencia o tráfego e o TLS com um wildcard do Let's Encrypt emitido por DNS-01, além do roteamento de Minecraft e do TLS para MQTT. Um proxy restrito da API Docker permite descobrir containers nos dois nós.\n\nOs serviços de mídia compartilham caminhos para permitir importações por hardlink sem interromper o seeding dos downloads. Scripts de configuração permitem recuperar as configurações dos serviços após a restauração de um backup. Cerca de 2.500 linhas de Bash e Python automatizam as redes, o DNS, as rotas e a configuração dos serviços."
pt-BR = "Opero um homelab de dois nós, com um manager amd64 e um worker arm64, que executa aproximadamente trinta stacks Docker Compose e Swarm. Gerencio implantação, redes, isolamento de serviços e automação para aplicativos, mídia, e-mail, automação residencial, hospedagem de código e servidores de jogos. Scripts de configuração restauram os ajustes dos serviços após a recuperação de backups.\n\nA arquitetura de rede separa o tráfego dos serviços, os bancos de dados e os containers com acesso à LAN. Um overlay privado conecta os serviços, a rede macvlan atribui endereços próprios na LAN e IPv6 públicos aos containers, e redes internas isolam os bancos sem acesso externo. Os serviços hospedados para amigos usam bridges dedicadas e acesso por WireGuard, sem rotas para as redes do lab ou para a LAN.\n\nA automação de DNS usa labels dos containers para atualizar registros no Cloudflare em diferentes contas e zonas, incluindo mudanças de IPv6 feitas pelo provedor. O Traefik gerencia o tráfego e o TLS com um wildcard do Let's Encrypt emitido por DNS-01, além do roteamento de Minecraft e do TLS para MQTT. Um proxy restrito da API Docker permite descobrir containers nos dois nós.\n\nOs serviços de mídia compartilham caminhos para permitir importações por hardlink sem interromper o seeding dos downloads. Scripts de configuração permitem recuperar as configurações dos serviços após a restauração de um backup. Cerca de 2.500 linhas de Bash e Python automatizam as redes, o DNS, as rotas e a configuração dos serviços."

