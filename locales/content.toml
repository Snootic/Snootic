[content.project.06.brief]
en = "ESP32 firmware for door access through cards and fingerprints. A local list of authorized cards keeps access available when the backend is unreachable."
pt = "Firmware para ESP32 que controla o acesso a portas por cartão e impressão digital. Uma lista local de cartões autorizados mantém o acesso disponível quando o backend está indisponível."
pt-BR = "Firmware para ESP32 que controla o acesso a portas por cartão e impressão digital. Uma lista local de cartões autorizados mantém o acesso disponível quando o backend está indisponível."

[content.project.06.detail]
en = "I designed the Sphynx firmware for an ESP32 access-control device that verifies cards and fingerprints, operates a door lock, and reports access decisions to a permission-management backend. Authorized cards are stored in flash, allowing access to continue when the backend is unavailable.\n\nThe C++ firmware uses PlatformIO and has separate modes for access control, card registration, and fingerprint enrollment. Administrators can initiate enrollment through a live connection. PN532 and MFRC522 readers share an interface selected at build time; PN532 is the default because it supports dynamic card IDs. A separate library handles the fingerprint sensor.\n\nWi-Fi setup uses a pairing page served through the device's access point. Once connected, the device publishes its address and hardware ID to discover the appropriate API. Remote unlock requests are validated against a stored token, an LED indicates status, and the relay closes again after five seconds. The project also became the subject of my academic article and led to my participation in Instituto TIM's AWC 2024 program."
pt = "Projetei o firmware do Sphynx para um dispositivo de controle de acesso com ESP32 que verifica cartões e impressões digitais, aciona a fechadura e informa as decisões de acesso ao backend de gerenciamento de permissões. Os cartões autorizados ficam armazenados na memória flash, permitindo o acesso quando o backend está indisponível.\n\nO firmware em C++ usa PlatformIO e possui modos separados para controle de acesso, cadastro de cartões e cadastro de impressões digitais. O administrador pode iniciar o cadastro por uma conexão ao vivo. Os leitores PN532 e MFRC522 compartilham uma interface selecionada no build; o PN532 é o padrão por oferecer suporte a IDs dinâmicos de cartões. Uma biblioteca separada gerencia o sensor de impressão digital.\n\nA configuração do Wi-Fi usa uma página de pareamento disponibilizada pelo ponto de acesso do dispositivo. Após a conexão, ele publica seu endereço e identificador de hardware para descobrir a API correspondente. Os pedidos de abertura remota são validados com um token armazenado, um LED indica o estado e o relé fecha novamente após cinco segundos. O projeto também foi tema do meu artigo acadêmico e levou à minha participação no programa AWC 2024 do Instituto TIM."
pt-BR = "Projetei o firmware do Sphynx para um dispositivo de controle de acesso com ESP32 que verifica cartões e impressões digitais, aciona a fechadura e informa as decisões de acesso ao backend de gerenciamento de permissões. Os cartões autorizados ficam armazenados na memória flash, permitindo o acesso quando o backend está indisponível.\n\nO firmware em C++ usa PlatformIO e possui modos separados para controle de acesso, cadastro de cartões e cadastro de impressões digitais. O administrador pode iniciar o cadastro por uma conexão ao vivo. Os leitores PN532 e MFRC522 compartilham uma interface selecionada no build; o PN532 é o padrão por oferecer suporte a IDs dinâmicos de cartões. Uma biblioteca separada gerencia o sensor de impressão digital.\n\nA configuração do Wi-Fi usa uma página de pareamento disponibilizada pelo ponto de acesso do dispositivo. Após a conexão, ele publica seu endereço e identificador de hardware para descobrir a API correspondente. Os pedidos de abertura remota são validados com um token armazenado, um LED indica o estado e o relé fecha novamente após cinco segundos. O projeto também foi tema do meu artigo acadêmico e levou à minha participação no programa AWC 2024 do Instituto TIM."

