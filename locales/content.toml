[content.project.05.brief]
en = "A multiplayer 3D exhibition with synchronized movement and object interaction. Visitors share a gallery where they can explore the displayed works in real time."
pt = "Exposição 3D multiplayer com movimentação e interação com objetos sincronizadas. Os visitantes compartilham uma galeria e podem explorar as obras expostas em tempo real."
pt-BR = "Exposição 3D multiplayer com movimentação e interação com objetos sincronizadas. Os visitantes compartilham uma galeria e podem explorar as obras expostas em tempo real."

[content.project.05.detail]
en = "I developed Socket Gallery as a shared exhibition using React Three Fiber. The scene includes modeled frames, lamps, and stands, with character movement, object interaction, and multiplayer sessions. Visitors can read the displayed works and see other participants moving through the gallery.\n\nSessions run at a fixed 20 Hz. The room creator publishes world updates, while guests send their own character state. New participants receive an initial snapshot; subsequent updates contain only changed objects, based on position, rotation, scale, and attached data, with a tolerance of 0.001 units. Redis stores room membership, and a Node/Express service with Socket.IO relays updates and WebRTC signaling.\n\nCharacter movement uses rays cast from the object's vertices to test surrounding geometry. Surface normals from those tests resolve collisions and allow movement along walls."
pt = "Desenvolvi o Socket Gallery como uma exposição compartilhada com React Three Fiber. A cena inclui quadros, luminárias e suportes modelados, com movimentação de personagens, interação com objetos e sessões multiplayer. Os visitantes podem ler as obras expostas e acompanhar a movimentação dos outros participantes pela galeria.\n\nAs sessões operam em um ciclo fixo de 20 Hz. O criador da sala publica as atualizações do cenário, enquanto os convidados enviam o estado dos próprios personagens. Novos participantes recebem um snapshot inicial; as atualizações seguintes incluem apenas os objetos alterados, considerando posição, rotação, escala e dados associados, com tolerância de 0,001 unidade. O Redis armazena os participantes das salas, e um serviço Node/Express com Socket.IO retransmite atualizações e a sinalização do WebRTC.\n\nA movimentação dos personagens usa raios lançados dos vértices do objeto para testar a geometria ao redor. As normais das superfícies encontradas resolvem as colisões e permitem o deslocamento ao longo das paredes."
pt-BR = "Desenvolvi o Socket Gallery como uma exposição compartilhada com React Three Fiber. A cena inclui quadros, luminárias e suportes modelados, com movimentação de personagens, interação com objetos e sessões multiplayer. Os visitantes podem ler as obras expostas e acompanhar a movimentação dos outros participantes pela galeria.\n\nAs sessões operam em um ciclo fixo de 20 Hz. O criador da sala publica as atualizações do cenário, enquanto os convidados enviam o estado dos próprios personagens. Novos participantes recebem um snapshot inicial; as atualizações seguintes incluem apenas os objetos alterados, considerando posição, rotação, escala e dados associados, com tolerância de 0,001 unidade. O Redis armazena os participantes das salas, e um serviço Node/Express com Socket.IO retransmite atualizações e a sinalização do WebRTC.\n\nA movimentação dos personagens usa raios lançados dos vértices do objeto para testar a geometria ao redor. As normais das superfícies encontradas resolvem as colisões e permitem o deslocamento ao longo das paredes."

