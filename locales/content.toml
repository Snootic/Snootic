[content.project.04.brief]
en = "A desktop application developed for document translation. It integrates DeepL and ChatGPT while preserving the original layout of Office documents."
pt = "Aplicativo desktop desenvolvido para tradução de documentos. Integra DeepL e ChatGPT e preserva o layout original dos arquivos do Office."
pt-BR = "Aplicativo desktop desenvolvido para tradução de documentos. Integra DeepL e ChatGPT e preserva o layout original dos arquivos do Office."

[content.project.04.detail]
en = "Developed AI Translator during my first internship at a translation company, reducing document translation and review time by 30% while preserving Office-document formatting. The application handles text alongside tables, styled paragraphs, slides, and charts. I later released the project under GPL-3.0.\n\nThe Python core reads Word, PowerPoint, and Excel files and inserts translations into their existing structure. Markers keep text fragments together when formatting splits a sentence, then map the translation back to the original fragments. Chart data is updated through the presentation library. DeepL and ChatGPT use the same document workflow with an API key supplied by the user. Glossaries, token estimates, and a translation cache support terminology consistency and request management.\n\nRust calls the Python core in-process through PyO3 and Tauri, without a separate document server. Windows builds include Python and install dependencies on first launch, with progress displayed in the interface. GitHub Actions handles builds, and the application supports automatic updates."
pt = "Desenvolvi o AI Translator durante meu primeiro estágio em uma empresa de tradução, reduzindo o tempo de tradução e revisão de documentos em 30% sem perder a formatação dos arquivos do Office. O aplicativo trabalha com texto, tabelas, parágrafos estilizados, slides e gráficos. Depois, publiquei o projeto sob a licença GPL-3.0.\n\nO core em Python lê arquivos do Word, PowerPoint e Excel e insere as traduções na estrutura existente. Marcadores mantêm os fragmentos de texto juntos quando a formatação divide uma frase e depois distribuem a tradução entre os trechos originais. Os dados dos gráficos são atualizados pela biblioteca de apresentações. DeepL e ChatGPT usam o mesmo fluxo de documentos, com uma chave de API fornecida pelo usuário. Glossários, estimativas de tokens e um cache de traduções ajudam a manter a terminologia e a gerenciar as requisições.\n\nO Rust chama o core Python no mesmo processo por PyO3 e Tauri, sem um servidor separado para os documentos. Os builds de Windows incluem Python e instalam as dependências na primeira execução, com o progresso exibido na interface. O GitHub Actions executa os builds, e o aplicativo oferece atualização automática."
pt-BR = "Desenvolvi o AI Translator durante meu primeiro estágio em uma empresa de tradução, reduzindo o tempo de tradução e revisão de documentos em 30% sem perder a formatação dos arquivos do Office. O aplicativo trabalha com texto, tabelas, parágrafos estilizados, slides e gráficos. Depois, publiquei o projeto sob a licença GPL-3.0.\n\nO core em Python lê arquivos do Word, PowerPoint e Excel e insere as traduções na estrutura existente. Marcadores mantêm os fragmentos de texto juntos quando a formatação divide uma frase e depois distribuem a tradução entre os trechos originais. Os dados dos gráficos são atualizados pela biblioteca de apresentações. DeepL e ChatGPT usam o mesmo fluxo de documentos, com uma chave de API fornecida pelo usuário. Glossários, estimativas de tokens e um cache de traduções ajudam a manter a terminologia e a gerenciar as requisições.\n\nO Rust chama o core Python no mesmo processo por PyO3 e Tauri, sem um servidor separado para os documentos. Os builds de Windows incluem Python e instalam as dependências na primeira execução, com o progresso exibido na interface. O GitHub Actions executa os builds, e o aplicativo oferece atualização automática."

